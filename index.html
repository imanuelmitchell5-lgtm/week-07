<h2>Dunkleosteus</h2>

<img src="gambar/01.png" alt="Dunkleosteus">

<p><strong>Era:</strong> Devon Akhir</p>

<p><strong>Tahun:</strong> Sekitar 382-358 juta tahun lalu</p>

<p>

Dunkleosteus adalah ikan berzirah raksasa yang menjadi salah satu predator lau paling menakutkan pada zaman Devon. Bagian kepalanya dilindungi lempeng tulang tebal dan memiliki rahang tajam seperti bilah.
